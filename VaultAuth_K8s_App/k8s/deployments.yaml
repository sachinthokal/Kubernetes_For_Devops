kind: Namespace
apiVersion: v1
metadata: 
  name: vault-ns

---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: vault-app-deployment
  namespace: vault-ns
  labels:
    app: vault-app
    env: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-app
  template:
    metadata:
      labels:
        app: vault-app
    spec:
      containers:
        - name: vault-app-container
          image: sachinthokal/vaultauth_k8s_app:v1
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 10m
              memory: 45Mi
            limits:
              cpu: 100m
              memory: 80Mi
              

---
kind: Service
apiVersion: v1
metadata:
  name: vault-app-service
  labels:
    app: vault-service
    env: prod
  namespace: vault-ns
spec:
  type: NodePort
  selector:
    app: vault-app
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30081