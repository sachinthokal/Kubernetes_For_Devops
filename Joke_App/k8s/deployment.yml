kind: Deployment
apiVersion: apps/v1
metadata:
  name: joke-app-deployment
  labels:
    app: joke-app
    environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: joke-app
  template:
    metadata:
      labels:
        app: joke-app
    spec:
      containers:
        - name: joke-app-container
          image: sachinthokal/joke_app:v35
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "100Mi"
              cpu: "50m"
            limits:
              memory: "250Mi"
              cpu: "100m"

---
kind: Service
apiVersion: v1
metadata:
  name: joke-app-service
  labels:
    app: joke-app
    environment: production
spec:
  type: LoadBalancer
  selector:
    app: joke-app
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000